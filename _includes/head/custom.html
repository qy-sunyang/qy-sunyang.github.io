<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">


<!-- MathJax v3: wrap long equations instead of overflowing -->
<script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$','$$'], ['\\[','\\]']],
          processEscapes: true
        },
        chtml: { linebreaks: { automatic: true, width: 'container' } },  // for tex-chtml
        svg:   { linebreaks: { automatic: true, width: 'container' } }   // if you ever switch to tex-svg
      };
    </script>
    <script defer id="MathJax-script"
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <!-- Keep math from blowing out the layout -->
    <style>
      mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
      mjx-container[display="true"] { display: block; } /* ensure display math uses full width */
    </style>
